/* ── Design tokens ──────────────────────────────────────────────
   Two themes, one ballpark: night is a game under the lights,
   day is a 1:10 first pitch. Day is NOT an inversion — Seattle
   daylight is cool and bright, so the light ground is pale sky,
   never cream.

   Text tokens carry contrast floors. --ink-faint is the dimmest
   value allowed to carry a word (>= 4.6:1 in both themes); borders
   and rules use --line, which has no floor because it is not text.
   ------------------------------------------------------------- */
:root{
  /* type scale — eight sizes, no more */
  --fs-hero:52px; --fs-title:44px; --fs-lg:28px; --fs-md:20px;
  --fs-body:15px; --fs-sm:13px;    --fs-label:11.5px; --fs-micro:10px;
  /* spacing rhythm */
  --sp-1:6px; --sp-2:10px; --sp-3:16px; --sp-4:24px; --sp-5:36px;
  --measure:1100px;
  /* fixed club colors — identical in both themes */
  --gold:#c8a840; --loss:#c06060; --live:#e04040;
}
/* Night — the default */
:root,:root[data-theme="night"]{
  color-scheme:dark;
  --bg:#03101f;
  --bg-tint-a:rgba(0,93,93,.15);
  --bg-tint-b:rgba(12,44,86,.25);
  --surface:#0a1c2e;
  --surface-sunk:#020911;
  --surface-card:rgba(12,44,86,.4);
  --line:rgba(0,181,172,.15);
  --line-strong:rgba(0,181,172,.32);
  --ink:#cfe3f0;        /* 12.9:1 */
  --ink-dim:#8fb0c4;    /*  7.2:1 */
  --ink-faint:#6d8ca2;  /*  4.7:1 — floor */
  --accent:#00B5AC;
  --accent-ink:#00B5AC; /* 7.5:1 on night ground */
  --accent-soft:rgba(0,181,172,.10);
  --accent-mid:rgba(0,181,172,.22);
  --mark:#E87722;
  --win-bg:rgba(0,181,172,.28);
  --loss-bg:rgba(180,60,60,.28);
  --shadow:0 20px 60px rgba(0,0,0,.6);
  --scrim:rgba(3,16,31,.8);
  --row-line:rgba(255,255,255,.05);
  --sea-row:rgba(0,181,172,.07);
  --focus:#4fd6cd;
  --lore-ink:#c89a5e;   /* 6.1:1 */
  --lore-bg:rgba(244,145,30,.05);
  --lore-line:rgba(244,145,30,.16);
  --lore-edge:rgba(244,145,30,.45);
  --po-bg:rgba(0,0,0,.45);
  --po-line:rgba(255,200,50,.15);
  /* mood gradient, despair → belief */
  --mood-0:#3a0808; --mood-1:#6a2020; --mood-2:#5a4020; --mood-3:#1a2a30;
  --mood-4:#0a3a30; --mood-5:#005a50; --mood-6:#007a70;
  --zone-0:#c05050; --zone-1:#b07050; --zone-2:#9a9070; --zone-3:#7a9090;
  --zone-4:#3a9888; --zone-5:#00b0a0; --zone-6:#00B5AC;
  --team-op:.44;
  --needle:rgba(255,255,255,.92);
  --needle-glow:rgba(255,255,255,.45);
  --ghost:rgba(190,225,240,.62);
}
/* Day — 1:10 first pitch, roof open, marine light */
:root[data-theme="day"]{
  color-scheme:light;
  /* club accents deepened for a pale ground — #c8a840 is 2.1:1 on white */
  --gold:#7a5f10; --loss:#a63d3d; --live:#c62828;
  --bg:#eef3f7;
  --bg-tint-a:rgba(0,150,142,.10);
  --bg-tint-b:rgba(120,165,200,.16);
  --surface:#ffffff;
  --surface-sunk:#e3ebf2;
  --surface-card:rgba(255,255,255,.92);
  --line:rgba(13,50,72,.14);
  --line-strong:rgba(0,114,108,.38);
  --ink:#0d2233;        /* 15.1:1 */
  --ink-dim:#3f5f74;    /*  7.1:1 */
  --ink-faint:#4d6a7d;  /*  4.9:1 — floor */
  --accent:#00B5AC;     /* graphics only */
  --accent-ink:#00726C; /*  4.9:1 on day ground — text safe */
  --accent-soft:rgba(0,114,108,.08);
  --accent-mid:rgba(0,114,108,.20);
  --mark:#a2470f;       /* deepened so it reads as text on pale ground */
  --win-bg:rgba(0,150,142,.22);
  --loss-bg:rgba(176,60,60,.20);
  --shadow:0 18px 50px rgba(13,34,51,.18);
  --scrim:rgba(13,34,51,.45);
  --row-line:rgba(13,50,72,.10);
  --sea-row:rgba(0,181,172,.12);
  --focus:#00726C;
  --lore-ink:#8a5a1e;   /* 5.9:1 on day ground */
  --lore-bg:rgba(200,120,20,.07);
  --lore-line:rgba(200,120,20,.22);
  --lore-edge:rgba(200,120,20,.55);
  --po-bg:rgba(190,160,60,.07);
  --po-line:rgba(150,115,20,.28);
  /* daylight mood ramp — no near-black end; it reads as a hole on paper */
  --mood-0:#a34242; --mood-1:#c07a52; --mood-2:#cbb277; --mood-3:#c3d0d6;
  --mood-4:#8fc2b4; --mood-5:#3f9e8f; --mood-6:#00857c;
  --zone-0:#a63d3d; --zone-1:#8f5426; --zone-2:#6f6535; --zone-3:#47595c;
  --zone-4:#2b6d5f; --zone-5:#00786c; --zone-6:#00726C;
  --team-op:.72;
  --needle:#0d2233;
  --needle-glow:rgba(13,34,51,.30);
  --ghost:rgba(13,34,51,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
body,#root{background:var(--bg)}
/* Flipping the theme changes the custom properties an element's `transition`
   is watching. Elements mid-transition can hold the outgoing theme's color,
   so suppress transitions for the frame the swap happens on. */
.theme-switching *,.theme-switching *::before,.theme-switching *::after{
  transition:none !important
}
</style>
<script>
/* Set the theme before first paint — React mounts too late to avoid a flash. */
(function(){
  try{
    var saved=localStorage.getItem("mm-theme");
    var t=(saved==="day"||saved==="night") ? saved
        : (window.matchMedia("(prefers-color-scheme: light)").matches ? "day" : "night");
    document.documentElement.setAttribute("data-theme",t);
    var m=document.querySelector('meta[name="theme-color"]');
    if(m) m.setAttribute("content", t==="day" ? "#eef3f7" : "#03101f");
  }catch(e){ document.documentElement.setAttribute("data-theme","night"); }
})();
</script>

  return year < now.getFullYear() || (year === now.getFullYear() && now.getMonth() >= 10);

}

function getTodayCursorIdx(tl) {
  if (!tl.length) return 0;
  const today = TODAY();
  let best = 0;
  for (let i = 0; i < tl.length; i++) {
    if (tl[i].date <= today) best = i; else break;
  }
  return best;
}

function fmtGameTime(isoStr) {
  if (!isoStr) return "";
  return new Date(isoStr).toLocaleTimeString("en-US", {
    hour: "numeric", minute: "2-digit", timeZone: TZ, timeZoneName: "short",
  });
}

function fmtDate(dateStr) {
  if (!dateStr) return "";
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

// Scale labels for the gauge. One vocabulary — these are the MOODS zone names,
// each placed at the centre of the span it actually covers, so the needle lands
// under the word the readout is showing. `anchor` entries survive to phone width.
const MOOD_TICKS = MOODS.map((z, i) => {
  const lo = i === 0 ? -100 : MOODS[i - 1].t;
  return {
    label: z.label,
    at: ((lo + z.t) / 2 + 100) / 2,
    anchor: i === 0 || i === 3 || i === MOODS.length - 1,
  };
});

const ROUND_ORDER = { F: 0, D: 1, L: 2, W: 3 };
const ROUND_NAMES = { F: "Wild Card", D: "Division Series", L: "LCS", W: "World Series" };

// ── API ──────────────────────────────────────────────────────
async function getTeamGames(teamId, year) {
  if (isSeasonComplete(year)) {
    const { data, error } = await sb.from("games").select("*")
      .eq("season", year).eq("team_id", teamId).eq("game_type", "R")
      .order("game_date");
    if (error) throw new Error(error.message);
    return data.map(g => ({
      date: g.game_date, wins: g.wins, losses: g.losses,
      result: g.result, score: g.score, oppScore: g.opp_score, opp: g.opp_abbr,
    }));
  }
  const r = await fetch(`${API}/schedule?sportId=1&season=${year}&teamId=${teamId}&gameType=R`);
  const d = await r.json();
  return (d.dates ?? []).flatMap(({ games }) =>
    games.filter(g => g.status.abstractGameState === "Final").map(g => {
      const mine = g.teams.home.team.id === teamId ? g.teams.home : g.teams.away;
      const them = g.teams.home.team.id === teamId ? g.teams.away : g.teams.home;
      if (!mine.leagueRecord) return null;
      return {
        date: g.officialDate,
        wins: mine.leagueRecord.wins, losses: mine.leagueRecord.losses,
        result: mine.isWinner ? "W" : "L",
        score: mine.score, oppScore: them.score, opp: them.team.name,
      };
    }).filter(Boolean)
  ).sort((a, b) => a.date.localeCompare(b.date));
}

async function getSeaFullSchedule(year) {
  if (isSeasonComplete(year)) {
    const { data, error } = await sb.from("games").select("*")
      .eq("season", year).eq("team_id", SEA_ID).order("game_date");
    if (error) throw new Error(error.message);
    const byDate = {};
    const playoffDates = [];
    data.forEach(g => {
      const isPost = g.game_type !== "R";
      byDate[g.game_date] = {
        date: g.game_date, pk: g.game_pk, isHome: g.is_home,
        oppName: g.opp_abbr, oppAbbr: g.opp_abbr,
        seaScore: g.score, oppScore: g.opp_score,
        state: "Final", gameTime: null, isPostseason: isPost,
        gameType: g.game_type, roundLabel: ROUND_NAMES[g.game_type] ?? null,
      };
      if (isPost && !playoffDates.includes(g.game_date)) playoffDates.push(g.game_date);
    });
    return { byDate, next: null, playoffDates: playoffDates.sort() };
  }

  // Current season — fetch from MLB API. hydrate=team is what puts
  // `abbreviation` on the team object; without it every current-season game
  // card falls back to "OPP".
  const [regR, poR] = await Promise.all([
    fetch(`${API}/schedule?sportId=1&season=${year}&teamId=${SEA_ID}&gameType=R&hydrate=team`),
    fetch(`${API}/schedule?sportId=1&season=${year}&teamId=${SEA_ID}&gameType=F,D,L,W&hydrate=team`),
  ]);
  const [regD, poD] = await Promise.all([regR.json(), poR.json()]);

  function parseGames(apiDates, isPostseason) {
    return (apiDates ?? []).flatMap(({ games }) =>
      games.map(g => {
        const isHome  = g.teams.home.team.id === SEA_ID;
        const seaSide = isHome ? g.teams.home : g.teams.away;
        const oppSide = isHome ? g.teams.away : g.teams.home;
        return {
          date:        g.officialDate,
          pk:          g.gamePk,
          isHome,
          oppName:     oppSide.team.name,
          oppAbbr:     oppSide.team.abbreviation,
          seaScore:    seaSide.score,
          oppScore:    oppSide.score,
          state:       g.status.abstractGameState,
          gameTime:    g.gameDate,
          isPostseason,
          gameType:    g.gameType,
          roundLabel:  ROUND_NAMES[g.gameType] ?? null,
        };
      })
    ).sort((a, b) => a.date.localeCompare(b.date));
  }

  const regGames = parseGames(regD.dates, false);
  const poGames  = parseGames(poD.dates, true);
  const allGames = [...regGames, ...poGames].sort((a, b) => a.date.localeCompare(b.date));

  const byDate = {};
  allGames.forEach(g => { byDate[g.date] = g; });

  const today = TODAY();
  const next  = regGames.find(g => g.date >= today && g.state === "Preview") ?? null;
  const playoffDates = poGames.map(g => g.date).filter((d, i, a) => a.indexOf(d) === i).sort();
  return { byDate, next, playoffDates };
}

async function getPlayoffGames(teamId, year) {
  try {
    let games;
    if (isSeasonComplete(year)) {
      const { data, error } = await sb.from("games").select("*")
        .eq("season", year).eq("team_id", teamId).neq("game_type", "R")
        .order("game_date");
      if (error) throw new Error(error.message);
      games = (data ?? []).map(g => ({
        date: g.game_date, gameType: g.game_type, result: g.result,
        score: g.score, oppScore: g.opp_score, opp: g.opp_abbr,
      }));
    } else {
      const r = await fetch(`${API}/schedule?sportId=1&season=${year}&teamId=${teamId}&gameType=F,D,L,W`);
      const d = await r.json();
      games = (d.dates ?? []).flatMap(({ games }) =>
        games.filter(g => g.status.abstractGameState === "Final").map(g => {
          const mine = g.teams.home.team.id === teamId ? g.teams.home : g.teams.away;
          const them = g.teams.home.team.id === teamId ? g.teams.away : g.teams.home;
          return { date: g.officialDate, gameType: g.gameType, result: mine.isWinner ? "W" : "L", score: mine.score, oppScore: them.score, opp: them.team.name };
        })
      ).sort((a, b) => a.date.localeCompare(b.date));
    }
    if (!games.length) return [];
    const map = {};
    games.forEach(g => {
      if (!map[g.gameType]) map[g.gameType] = { gameType: g.gameType, round: ROUND_NAMES[g.gameType], games: [], opp: g.opp };
      map[g.gameType].games.push(g);
    });
    return Object.values(map)
      .sort((a, b) => (ROUND_ORDER[a.gameType] ?? 9) - (ROUND_ORDER[b.gameType] ?? 9))
      .map(s => ({ ...s, wins: s.games.filter(g => g.result === "W").length, losses: s.games.filter(g => g.result === "L").length, advanced: s.games.at(-1)?.result === "W", eliminated: s.games.at(-1)?.result === "L" }));
  } catch { return []; }
}

async function getLinescore(pk) {
  const r = await fetch(`${API}/game/${pk}/linescore`);
  return r.json();
}

function buildTimeline(gamesByTeam) {
  const ids   = Object.keys(gamesByTeam).map(Number);
  const dates = [...new Set(Object.values(gamesByTeam).flat().map(g => g.date))].sort();
  const rec   = Object.fromEntries(ids.map(id => [id, { w: 0, l: 0, last: null }]));
  const runs  = Object.fromEntries(ids.map(id => [id, { rs: 0, ra: 0 }])); // cumulative runs scored / allowed
  const tl    = [];
  for (const date of dates) {
    let hit = false;
    ids.forEach(id => {
      const gs = gamesByTeam[id]?.filter(g => g.date === date);
      if (gs?.length) {
        const g = gs.at(-1);
        rec[id] = { w: g.wins, l: g.losses, last: g.result };
        // Sum every game on the date (covers doubleheaders) into the run totals.
        gs.forEach(gg => {
          if (Number.isFinite(gg.score) && Number.isFinite(gg.oppScore)) {
            runs[id].rs += gg.score; runs[id].ra += gg.oppScore;
          }
        });
        hit = true;
      }
    });
    if (!hit) continue;
    let lW = 0, lL = 999;
    ids.forEach(id => { if (rec[id].w > lW || (rec[id].w === lW && rec[id].l < lL)) { lW = rec[id].w; lL = rec[id].l; } });
    const standings = Object.fromEntries(ids.map(id => {
      const { w, l, last } = rec[id];
      return [id, { w, l, last, rs: runs[id].rs, ra: runs[id].ra, gb: Math.max(0, ((lW - w) + (l - lL)) / 2), pct: (w + l) > 0 ? w / (w + l) : 0 }];
    }));
    tl.push({ date, standings });
  }
  return tl;
}

function calcMood(sea, idx, total, recent, playoffRuns, inProgress) {
  if (!sea || sea.w + sea.l < 5) return 0;
  // Season progress. For a finished season the cursor spans the whole timeline,
  // so idx/total is correct. For a season still in progress the timeline only
  // reaches "today", so idx/total is ~1.0 by July — which would fire the
  // stretch-run bonuses months early. Measure by games played / 162 instead.
  const thru = inProgress ? Math.min(1, (sea.w + sea.l) / 162) : idx / Math.max(1, total);
  const madePlayoffs = idx >= total - 1 && playoffRuns?.length > 0;
  const pct = sea.w / (sea.w + sea.l);
  // How good the team is has to outweigh how far back it sits, or every season
  // more than ~9 games out flattens into the same zone regardless of record —
  // which is how 89-win 2018 used to read the same as 61-win 2010.
  let m = (pct - 0.5) * 240;
  // Games back. Softer slope than a straight deficit penalty, because in the
  // wild-card era the division is not the only door — and once a team is
  // actually in, the deficit stops describing how the season felt at all.
  // 2022 finished 16 back of a 106-win Houston and ended a 21-year drought.
  m -= madePlayoffs
    ? Math.min(sea.gb * 2, 15)
    : Math.min(sea.gb * (2 + thru * 5), 38);
  if (recent?.length) m += (recent.filter(r => r === "W").length / recent.length - 0.5) * 36;
  // Division position: actually being in first is emotionally distinct from
  // chasing it. A discrete lead bonus plus a fading credit for hanging close,
  // wide enough that a live race in July reads like one.
  m += (sea.gb === 0 ? 12 : 0) + Math.max(0, 18 - sea.gb * 6);
  // Momentum: a live win/loss streak colors how it feels right now. A 3-game
  // skid and a 3-game surge shouldn't land in the same place at an even last-10.
  if (recent?.length) {
    const last = recent.at(-1);
    let streak = 0;
    for (let i = recent.length - 1; i >= 0 && recent[i] === last; i--) streak++;
    m += (last === "W" ? 1 : -1) * Math.min(streak, 5) * 2.2;   // up to ±11
  }
  if (thru > 0.75 && sea.gb < 2)  m += 28;
  // Out of it late — but only if they were actually bad. A winning team that
  // missed by three games is a different feeling from one losing 100.
  if (thru > 0.80 && sea.gb > 12 && pct < 0.5 && !madePlayoffs) m -= 22;
  if (madePlayoffs) {
    // Getting there is the thing. October always ends badly for 29 teams, so
    // qualifying has to outweigh the elimination that necessarily follows it —
    // otherwise every playoff season scores below every quiet losing one.
    m += 55;
    const last = playoffRuns.at(-1);
    if (last.eliminated) {
      m -= ({ F: 8, D: 15, L: 25, W: 35 }[last.gameType] ?? 8);
      if (last.gameType === "L" && last.wins >= 2) m -= 15;   // came within a game
    } else {
      m = Math.min(100, m + 45);                              // won it all
    }
  }
  return Math.max(-100, Math.min(100, m));
}

// ── Run differential "reality" layer ─────────────────────────
// Pythagorean expectation: the record a team "should" have given how many runs
// it has scored vs. allowed. Exponent 1.83 is the standard modern baseball fit.
function pythagWins(rs, ra, gp) {
  if (!gp || (rs <= 0 && ra <= 0)) return null;
  const e = 1.83;
  const wpct = Math.pow(rs, e) / (Math.pow(rs, e) + Math.pow(ra, e));
  return Math.round(wpct * gp);
}

// Bundles the run-differential story for the cursor date: the ghost-needle mood
// and the fields the caption needs. Returns null when it's too early (or there's
// no run data) for the numbers to mean anything yet.
function buildReality(sea, cursor, total, recent, playoffRuns, onlyPositive, inProgress) {
  if (!sea) return null;
  const gp = sea.w + sea.l;
  const rs = sea.rs ?? 0, ra = sea.ra ?? 0;
  const expW = pythagWins(rs, ra, gp);
  if (gp < 10 || expW == null) return null;                 // small-sample guard
  const expL    = gp - expW;
  const runDiff = rs - ra;
  const luck    = sea.w - expW;                             // + = overperforming (lucky), − = unlucky
  // Ghost mood: rerun the meter as if the record matched the run differential.
  // Everything but the record is held fixed, so the gap isolates luck alone.
  const ghostMood = calcMood({ ...sea, w: expW, l: expL }, cursor, total, recent, playoffRuns, inProgress);
  return { runDiff, expW, expL, luck, ghostMood, best: !!onlyPositive,
           w: sea.w, l: sea.l, firstPlace: sea.gb === 0 };
}

function smoothSvgPath(pts, t = 0.35) {
  if (!pts.length) return "";
  if (pts.length === 1) return `M${pts[0].x},${pts[0].y}`;
  let d = `M${pts[0].x.toFixed(1)},${pts[0].y.toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    d += ` C${(p1.x + (p2.x - p0.x) * t).toFixed(1)},${(p1.y + (p2.y - p0.y) * t).toFixed(1)} ${(p2.x - (p3.x - p1.x) * t).toFixed(1)},${(p2.y - (p3.y - p1.y) * t).toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
  }
  return d;
}

// ── The October register ─────────────────────────────────────
// The regular-season meter reads a record. October doesn't have one worth
// reading — the standings are frozen at the September finale, and what a fan
// actually feels is series state: up 2-0, facing elimination, still alive.
// These build a second register for the postseason dates, leaving the
// regular-season record, the chart, and the timeline untouched.

// How many wins the series took. The winner's total IS the format: a best-of-7
// that ends 4-2 gives 4, a best-of-3 gives 2, a one-game Wild Card gives 1.
function seriesNeeded(s) { return Math.max(s.wins, s.losses) || 1; }

// Each series as it stood on the cursor date.
function octoberState(runs, cursorDate) {
  if (!runs?.length || !cursorDate) return null;
  const series = runs.map(s => {
    const needed = seriesNeeded(s);
    const played = s.games.filter(g => g.date <= cursorDate);
    const w = played.filter(g => g.result === "W").length;
    const l = played.filter(g => g.result === "L").length;
    return {
      round: s.round, gameType: s.gameType, opp: s.opp, needed, w, l,
      maxGames: needed * 2 - 1,
      started: played.length > 0,
      won:  w >= needed,
      lost: l >= needed,
      brink: w === needed - 1 && l < needed,          // one win from clinching
      facingElim: l === needed - 1 && w < needed,     // one loss from out
      games: s.games.map(g => ({ ...g, played: g.date <= cursorDate })),
    };
  });
  const started = series.filter(s => s.started);
  if (!started.length) return null;
  return { series, current: started.at(-1), roundsWon: started.filter(s => s.won).length };
}

const ROUND_DEPTH = { F: 0, D: 8, L: 18, W: 30 };

function calcOctoberMood(state) {
  if (!state) return 0;
  const { current, roundsWon } = state;
  // You are playing baseball in October. That is the floor of the feeling.
  let m = 30;
  m += ROUND_DEPTH[current.gameType] ?? 0;
  m += roundsWon * 18;
  if (current.won && current.gameType === "W") return 100;   // won it all
  if (current.won)             m += 25;
  else if (current.lost)       m -= 30;
  else if (current.facingElim) m -= 22;
  else if (current.brink)      m += 18;
  else if (current.w > current.l) m += 12;
  else if (current.l > current.w) m -= 12;
  // Getting eliminated in October still beats a season that never got there,
  // so the worst this register reads is DISAPPOINTED.
  return Math.max(-34, Math.min(100, m));
}

function octoberTone(s) {
  if (!s) return "";
  if (s.lost || s.facingElim) return "luck-bad";
  if (s.won || s.brink || s.w > s.l) return "luck-good";
  return "";
}

// The line under the gauge during October, in place of record/earned/luck.
function octoberPhrase(state) {
  const s = state?.current;
  if (!s) return null;
  if (s.won && s.gameType === "W") return "World Series champions";
  if (s.won)  return `won the ${s.round} ${s.w}–${s.l}`;
  if (s.lost) return `out of the ${s.round} ${s.w}–${s.l}`;
  if (s.facingElim) return `down ${s.w}–${s.l}, facing elimination`;
  if (s.brink) return `up ${s.w}–${s.l}, one win from the next round`;
  if (s.w > s.l) return `up ${s.w}–${s.l}`;
  if (s.l > s.w) return `down ${s.w}–${s.l}`;
  return `even ${s.w}–${s.l}`;
}

// ── Chart ─────────────────────────────────────────────────────
function Chart({ timeline, teams, cursor, onCursor }) {
  const svgRef   = useRef(null);
  const dragging = useRef(false);
  const P = { t: 16, r: 18, b: 30, l: 58 };
  const W = 900, H = 240, iW = W - P.l - P.r, iH = H - P.t - P.b;

  const maxGB = useMemo(() => {
    let m = 5;
    timeline.forEach(d => Object.values(d.standings).forEach(s => { if (s.gb > m) m = s.gb; }));
    return Math.ceil(m / 5) * 5;
  }, [timeline]);

  const xs = useCallback(i  => P.l + (i / Math.max(1, timeline.length - 1)) * iW, [timeline.length, iW]);
  const ys = useCallback(gb => P.t + (gb / maxGB) * iH, [maxGB, iH]);

  const paths = useMemo(() => teams.map(t => ({
    ...t,
    d: smoothSvgPath(
      timeline.map((pt, i) => { const s = pt.standings[t.id]; return s ? { x: xs(i), y: ys(s.gb) } : null; }).filter(Boolean)
    ),
  })), [timeline, teams, xs, ys]);

  const monthTicks = useMemo(() => {
    const seen = new Set();
    return timeline.map((pt, i) => {
      const m = pt.date.slice(5, 7);
      if (seen.has(m)) return null;
      seen.add(m);
      return { i, label: ["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m] };
    }).filter(Boolean);
  }, [timeline]);

  const getIdx = useCallback((cx) => {
    if (!svgRef.current) return 0;
    const rect = svgRef.current.getBoundingClientRect();
    const sx = ((cx - rect.left) / rect.width) * W;
    return Math.max(0, Math.min(timeline.length - 1, Math.round(((sx - P.l) / iW) * (timeline.length - 1))));
  }, [timeline.length, iW]);

  const onDown = e => { dragging.current = true; svgRef.current?.setPointerCapture(e.pointerId); onCursor(getIdx(e.clientX)); };
  const onMove = e => { if (dragging.current) onCursor(getIdx(e.clientX)); };
  const onUp   = () => { dragging.current = false; };

  const cursorX = xs(cursor);
  const seaGb   = timeline[cursor]?.standings[SEA_ID]?.gb ?? 0;
  const gbTicks = Array.from({ length: maxGB / 5 + 1 }, (_, i) => i * 5);
  const cursorLabel = fmtDate(timeline[cursor]?.date).toUpperCase();
  const flagW = Math.max(34, cursorLabel.length * 5.6 + 10);

  return (
    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} role="img"
      aria-label={`Games back by date for each AL West team. Cursor is on ${timeline[cursor]?.date ?? ""}.`}
      style={{ width: "100%", display: "block", cursor: "crosshair", userSelect: "none" }}
      onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerLeave={onUp}>
      <rect x={P.l} y={P.t} width={iW} height={ys(3) - P.t} fill="var(--accent-soft)" />
      {gbTicks.map(gb => (
        <g key={gb}>
          <line x1={P.l} y1={ys(gb)} x2={W - P.r} y2={ys(gb)}
            stroke={gb === 0 ? "var(--line-strong)" : "var(--row-line)"} strokeWidth={gb === 0 ? 1.5 : 1} />
          <text x={P.l - 8} y={ys(gb) + 4} textAnchor="end"
            fill={gb === 0 ? "var(--accent-ink)" : "var(--ink-faint)"} fontSize={10} fontFamily="Barlow Condensed,sans-serif">{gb}</text>
        </g>
      ))}
      <text x={11} y={P.t + iH / 2} textAnchor="middle" fill="var(--ink-faint)" fontSize={9}
        fontFamily="Barlow Condensed,sans-serif" letterSpacing={1.5}
        transform={`rotate(-90, 11, ${P.t + iH / 2})`}>GAMES BACK</text>
      {monthTicks.map(({ i, label }) => (
        <text key={i} x={xs(i)} y={H - 4} textAnchor="middle"
          fill="var(--ink-faint)" fontSize={10} fontFamily="Barlow Condensed,sans-serif" letterSpacing={1}>{label}</text>
      ))}
      {paths.map(t => t.d && (
        <path key={t.id} d={t.d} fill="none" stroke={t.color}
          strokeWidth={t.sea ? 2.6 : 1.4}
          style={{ strokeOpacity: t.sea ? 1 : "var(--team-op)" }}
          strokeLinecap="round" strokeLinejoin="round" />
      ))}
      <line x1={cursorX} y1={P.t} x2={cursorX} y2={H - P.b}
        stroke="var(--mark)" strokeWidth={1.5} strokeDasharray="4 3" strokeOpacity={0.75} />
      {/* Date flag — turns the cursor from a hairline into something that
          reads as a handle you can take hold of. */}
      {cursorLabel && (
        <g style={{ pointerEvents: "none" }}>
          <rect x={Math.min(W - P.r - flagW, Math.max(P.l, cursorX - flagW / 2))} y={2}
            width={flagW} height={13} rx={2} fill="var(--mark)" />
          <text x={Math.min(W - P.r - flagW / 2, Math.max(P.l + flagW / 2, cursorX))} y={11.5}
            textAnchor="middle" fill="var(--bg)" fontSize={9} fontWeight={700}
            fontFamily="Barlow Condensed,sans-serif" letterSpacing={0.6}>{cursorLabel}</text>
        </g>
      )}
      <circle cx={cursorX} cy={ys(seaGb)} r={6.5} fill="var(--accent)" stroke="var(--surface-sunk)" strokeWidth={2.5} />
    </svg>
  );
}

// ── Game Card ─────────────────────────────────────────────────
function GameCard({ game, nextGame, cursorDate, linescore }) {
  const today   = TODAY();
  const isToday = cursorDate === today;

  const isFinal   = game?.state === "Final";
  const isLive    = game?.state === "Live";
  const isPreview = game?.state === "Preview";
  const showScore = (isFinal || isLive) && game != null;

  let statusLabel = isToday ? "TODAY" : fmtDate(cursorDate);
  if (game) {
    if (isToday && isLive)                  statusLabel = null; // handled with JSX below
    else if (isToday && isFinal)            statusLabel = "FINAL · TODAY";
    else if (isToday && isPreview)          statusLabel = "TODAY";
    else if (isFinal && game.isPostseason)  statusLabel = `FINAL · ${game.roundLabel ?? "POSTSEASON"} · ${fmtDate(cursorDate)}`;
    else if (isFinal)                       statusLabel = `FINAL · ${fmtDate(cursorDate)}`;
    else                                    statusLabel = fmtDate(cursorDate);
  }

  const inn = game && isLive && linescore
    ? `${linescore.inningState ?? ""} ${linescore.currentInningOrdinal ?? ""}`.trim()
    : game && isPreview ? fmtGameTime(game.gameTime)
    : "";

  // Score values — fall back to placeholders so the block always takes up space
  const seaScore = showScore ? (game.seaScore ?? "—") : "—";
  const oppScore = showScore ? (game.oppScore ?? "—") : "—";
  const oppAbbr  = game?.oppAbbr || "OPP";

  return (
    <div className="game-card">
      <div className="game-left">
        <div className="game-status">{statusLabel === null ? <><span className="live-dot" />LIVE</> : statusLabel}</div>
        {game
          ? <div className="game-matchup">{game.isHome ? `vs ${game.oppName}` : `@ ${game.oppName}`}</div>
          : <div className="game-nogame">No game{isToday ? " today." : "."}</div>
        }
        {inn && <div className="game-sub">{inn}</div>}
        {!game && nextGame && (
          <div className="game-next">
            Next up: <b>{nextGame.isHome ? "vs" : "@"} {nextGame.oppName}</b>
            {" · "}{fmtDate(nextGame.date)}{" · "}{fmtGameTime(nextGame.gameTime)}
          </div>
        )}
        {game && isToday && nextGame && nextGame.date !== cursorDate && (
          <div className="game-next">
            Next: <b>{nextGame.isHome ? "vs" : "@"} {nextGame.oppName}</b>
            {" · "}{fmtDate(nextGame.date)}
          </div>
        )}
      </div>
      {/* Always render score block — visibility:hidden on no-score days keeps height stable */}
      <div className="game-score" style={{ visibility: showScore ? "visible" : "hidden" }}>
        <div className="sc-t">
          <div className="sc-abbr" style={{ color: "var(--accent-ink)" }}>SEA</div>
          <div className="sc-num sea">{seaScore}</div>
        </div>
        <div className="sc-vs">·</div>
        <div className="sc-t">
          <div className="sc-abbr">{oppAbbr}</div>
          <div className="sc-num">{oppScore}</div>
        </div>
      </div>
    </div>
  );
}

function ThemeToggle({ theme, onToggle }) {
  const isDay = theme === "day";
  return (
    <button type="button" className={`theme-switch${isDay ? " is-day" : ""}`}
      role="switch" aria-checked={isDay} aria-label="Day theme"
      title={isDay ? "Switch to night" : "Switch to day"}
      onClick={onToggle}>
      <span className="ts-track" aria-hidden="true">

        <span className="ts-knob">{isDay ? SunIcon : MoonIcon}</span>
      </span>
    </button>
  );
}

// Reads what the no-flash script in <head> already decided, so the button
// never disagrees with what is on screen.
function useTheme() {
  const [theme, setTheme] = useState(() =>
    document.documentElement.getAttribute("data-theme") === "day" ? "day" : "night");
  // Whether this visitor has stated a preference. Starts true if a previous
  // visit saved one — persisting on mount instead would silently opt everyone
  // out of following their system setting.
  const chosen = useRef((() => {
    try { return !!localStorage.getItem("mm-theme"); } catch { return false; }
  })());

  useEffect(() => {
    const el = document.documentElement;
    el.classList.add("theme-switching");
    el.setAttribute("data-theme", theme);
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", theme === "day" ? "#eef3f7" : "#03101f");
    // Two frames: one for the swap to paint, one to hand transitions back.
    let inner;
    const outer = requestAnimationFrame(() => {
      inner = requestAnimationFrame(() => el.classList.remove("theme-switching"));
    });
    return () => { cancelAnimationFrame(outer); cancelAnimationFrame(inner); };
  }, [theme]);

  // Follow the system until the visitor states a preference of their own.
  useEffect(() => {
    const mq = window.matchMedia("(prefers-color-scheme: light)");
    const onChange = e => { if (!chosen.current) setTheme(e.matches ? "day" : "night"); };
    mq.addEventListener("change", onChange);
    return () => mq.removeEventListener("change", onChange);
  }, []);

  const toggle = useCallback(() => setTheme(t => {
    const next = t === "day" ? "night" : "day";
    chosen.current = true;
    try { localStorage.setItem("mm-theme", next); } catch {}
    return next;
  }), []);

  return [theme, toggle];
}

function MoodMeter({ mood, zone, reality, october, onExplain }) {
  // October has no second needle — the standings are frozen, so a run
  // differential against them would be measuring September.
  if (october) reality = null;
  const pct      = (mood + 100) / 2;
  const ghostPct = reality ? (reality.ghostMood + 100) / 2 : null;
  const ghostRight = reality && ghostPct >= pct;   // earned better than the record → good
  return (
    <div className="mood-section">
      <div className="mood-header">
        <span className="st">Fan Feelings Meter{october ? " · October" : ""}</span>
        <div className="mood-state">
          <span className="mood-txt" style={{ color: zone.color }}>{zone.label}</span>
        </div>
      </div>
      <div className="mood-meter" role="img"
        aria-label={reality
          ? `Fan feeling: ${zone.label}. Record ${reality.w}–${reality.l}; expected record from run differential ${reality.expW}–${reality.expL}.`
          : `Fan feeling: ${zone.label}.`}>
        <div className="mood-bar">
          <div className="mood-grad" />
          {reality && (
            <div className="mood-gap" style={{
              left: `${Math.min(pct, ghostPct)}%`,
              width: `${Math.abs(pct - ghostPct)}%`,
              background: ghostRight ? "var(--accent-mid)" : "var(--loss-bg)",
            }} />
          )}
          {reality && <div className="mood-ghost" style={{ left: `${ghostPct}%` }} />}
          <div className="mood-needle" style={{ left: `${pct}%` }} />
        </div>
      </div>
      <div className="mood-labels">
        {MOOD_TICKS.map(t => (
          <span key={t.label} className={`ml${t.anchor ? "" : " ml-wide"}`}
            style={{ left: `${t.at}%`, transform: `translateX(${t.at <= 12 ? "0" : t.at >= 88 ? "-100%" : "-50%"})` }}>
            {t.label}
          </span>
        ))}
      </div>
      {october && (
        <div className="mood-luck">
          <span><b>{october.current.round}</b> vs {october.current.opp}</span>
          <span className="luck-sep">·</span>
          <span className={octoberTone(october.current)}>{octoberPhrase(october)}</span>
          {october.roundsWon > 0 && <><span className="luck-sep">·</span>
            <span>{october.roundsWon} {october.roundsWon === 1 ? "round" : "rounds"} won</span></>}
        </div>
      )}
      {reality && !october && (
        <div className="mood-luck">
          <span className="lk"><i className="nt-solid" />Record <b>{reality.w}–{reality.l}</b></span>
          <span className="luck-sep">·</span>
          <span className="lk"><i className="nt-ghost" />Expected <b>{reality.expW}–{reality.expL}</b></span>
          <span className="luck-sep">·</span>
          <button type="button" className="luck-explain" onClick={onExplain}>How Expected is figured</button>
        </div>
      )}
    </div>
  );
}

function SeaBox({ sea, rank, recent, reality }) {
  if (!sea) return null;
  const { w, l, gb, pct } = sea;
  const total = w + l;
  const proj  = total > 0 ? Math.round((w / total) * 162) : 81;
  const gbColor = gb === 0 ? "var(--accent-ink)" : gb < 5 ? "var(--ink)" : gb < 12 ? "var(--mark)" : "var(--loss)";
  const suffix  = (["", "st", "nd", "rd"])[rank] || "th";
  return (
    <div className="panel">
      <div className="plbl">Season Record</div>
      <div className="big-rec">{w}–{l}</div>
      <div className="meta-row">
        <div><div className="mb-lbl">Win Pct</div><div className="mb-val" style={{ color: "var(--ink)" }}>{pct.toFixed(3).replace(/^0/, "")}</div></div>
        <div><div className="mb-lbl">{gb === 0 ? "Division" : "Games Back"}</div><div className="mb-val" style={{ color: gbColor }}>{gb === 0 ? "1st" : gb % 1 === 0 ? String(gb) : gb.toFixed(1)}</div></div>
        <div><div className="mb-lbl">Div Rank</div><div className="mb-val" style={{ color: rank === 1 ? "var(--accent-ink)" : "var(--ink)" }}>{rank}{suffix}</div></div>
        <div><div className="mb-lbl">Proj Wins</div><div className="mb-val" style={{ color: proj >= 90 ? "var(--accent-ink)" : proj >= 81 ? "var(--ink)" : "var(--mark)" }}>{proj}</div></div>
        {reality && <div><div className="mb-lbl">Run Diff</div><div className="mb-val" style={{ color: reality.runDiff >= 0 ? "var(--accent-ink)" : "var(--mark)" }}>{reality.runDiff > 0 ? "+" : ""}{reality.runDiff}</div></div>}
        {reality && <div><div className="mb-lbl">Expected</div><div className="mb-val" style={{ color: "var(--ink)" }}>{reality.expW}–{reality.expL}</div></div>}
      </div>
      {recent.length > 0 && (
        <div>
          <div className="mb-lbl" style={{ marginTop: 10 }}>Last {recent.length}</div>
          <div className="streak">{recent.map((r, i) => <div key={i} className={`sg ${r === "W" ? "w" : "l"}`}>{r}</div>)}</div>
        </div>
      )}
    </div>
  );
}

// ── Playoff Panel ─────────────────────────────────────────────
// The panel keeps its full structure at every cursor position — rounds,
// opponents, and one slot per possible game in the format — and fills the
// results in as the cursor passes each date. Structure never changes, so the
// page never jumps; the same reason the game card uses visibility:hidden
// instead of display:none. The season lore already states the outcome, so
// there is nothing here worth hiding — the point is that October moves.
function PlayoffPanel({ runs, year, madePlayoffs, cursorDate, onJump }) {
  if (!madePlayoffs && !runs.length) return <div className="missed-po">Did not qualify for the postseason.</div>;
  const champion = runs.length && !runs.at(-1).eliminated;
  const state = octoberState(runs, cursorDate);
  const reached = !!state;
  const champRevealed = champion && state?.current?.won && state.current.gameType === "W";
  return (
    <div className="po-wrap">
      <div className="po-hdr">
        <span className="po-title">Postseason · {year}</span>
        {champRevealed
          ? <span className="po-result champ">⭐ World Series Champions</span>
          : <span className="po-hint">{reached ? "" : "Click a game to jump there"}</span>}
      </div>
      <div className="po-body">
        {runs.map((s, i) => {
          const needed = seriesNeeded(s);
          const slots  = needed * 2 - 1;
          const played = s.games.filter(g => !cursorDate || g.date <= cursorDate);
          const w = played.filter(g => g.result === "W").length;
          const l = played.filter(g => g.result === "L").length;
          const decided = w >= needed || l >= needed;
          return (
            <div key={i} className={`po-series${played.length ? "" : " po-pending"}`}>
              <span className="po-round">{s.round}</span>
              <span className="po-opp">vs {s.opp}</span>
              <div className="po-games">
                {Array.from({ length: slots }, (_, j) => {
                  // Five October dates sit against 162 regular-season ones, so
                  // dragging to them is a pixel hunt. The chips are the shortcut.
                  const g = s.games[j];
                  const isPlayed = !!played[j];
                  if (!g) return <div key={j} className="po-g po-g-empty" aria-hidden="true" />;
                  return (
                    <button key={j} type="button"
                      className={`po-g po-g-btn ${isPlayed ? (g.result === "W" ? "w" : "l") : "po-g-empty"}`}
                      onClick={() => onJump?.(g.date)}
                      aria-label={`Go to ${s.round} game ${j + 1}, ${fmtDate(g.date)}`}
                      title={`Go to ${fmtDate(g.date)}`}>
                      {isPlayed ? g.result : ""}
                    </button>
                  );
                })}
              </div>
              <span className={`po-result ${decided ? (l >= needed ? "lost" : "won") : "po-result-open"}`}>
                {decided ? (l >= needed ? `Lost ${w}–${l}` : `Won ${w}–${l}`)
                         : played.length ? `${w}–${l}` : "—"}
              </span>
            </div>
          );
        })}
      </div>
      {PLAYOFF_LORE[year] && <div className="po-lore">{PLAYOFF_LORE[year]}</div>}
    </div>
  );
}

  function copyText(text, setFlag, node) {

      if (!items.length) return;
      const first = items[0], last = items[items.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    };
    document.addEventListener("keydown", onKey, true);
    return () => {
      document.removeEventListener("keydown", onKey, true);
      if (opener instanceof HTMLElement) opener.focus();

        <div className="modal-h">Where the data comes from</div>

        <p className="modal-p"><b>1977 to 2004</b> is the part that took work. The MLB API doesn't reach back that far, so this project parses <a className="modal-link" href="https://www.retrosheet.org" target="_blank" rel="noopener">Retrosheet's</a> free game logs, computes the cumulative records they don't include, normalizes them to match the API's shape, and loads them into a Postgres database alongside the modern seasons. That's 41,521 games, the full franchise, served from one place.</p>

        <div className="modal-h">What "Expected" means</div>

function App() {
  const [year, setYear]            = useState(null);
  const [teams, setTeams]          = useState([]);
  const [timeline, setTl]          = useState([]);
  const [playoffRuns, setPoRuns]   = useState([]);
  const [madePlayoffs, setMadeP]   = useState(false);
  const [loading, setLoading]      = useState(false);
  const [error, setError]          = useState("");
  const [cursor, setCursor]        = useState(0);
  const [seaByDate, setSeaByDate]  = useState({});
  const [nextGame, setNextGame]    = useState(null);
  const [linescore, setLinescore]  = useState(null);
  const [showAbout, setShowAbout]  = useState(false);
  const [theme, toggleTheme]       = useTheme();
  const liveRef   = useRef(null);
  const preMsg    = useMemo(() => PRE_SEASON[Math.floor(Math.random() * PRE_SEASON.length)], []);
  const nowYear   = new Date().getFullYear();
  const yearOpts  = useMemo(() => Array.from({ length: nowYear - 1976 }, (_, i) => nowYear - i), []);

  useEffect(() => { getDefaultYear().then(y => setYear(y)); }, []);

  useEffect(() => {
    if (year === null) return;
    const divTeams = TEAMS_BY_YEAR(year);
    setTeams(divTeams);
    setTl([]); setPoRuns([]); setMadeP(false); setError("");
    setSeaByDate({}); setNextGame(null); setLinescore(null);
    setLoading(true);
    Promise.all([
      Promise.all(divTeams.map(t => getTeamGames(t.id, year).then(gs => [t.id, gs]))),
      getPlayoffGames(SEA_ID, year),
      getSeaFullSchedule(year),
    ]).then(([pairs, po, sched]) => {
      let tl = buildTimeline(Object.fromEntries(pairs));
      // Append one entry per playoff game date (standings frozen at regular season end)
      // so the cursor can scrub into the postseason and show those games in the card.
      if (tl.length && sched.playoffDates.length) {
        // Null out 'last' so playoff extension entries don't bleed into the Last 10 streak
        const frozenStandings = Object.fromEntries(
          Object.entries(tl.at(-1).standings).map(([id, s]) => [id, { ...s, last: null }])
        );
        sched.playoffDates.forEach(date => {
          if (!tl.find(e => e.date === date)) {
            tl = [...tl, { date, standings: frozenStandings, isPlayoff: true }];
          }
        });
      }
      // If season is in progress and today isn't in the timeline, append it
      // so the cursor lands on today and "Next up" text renders naturally.
      if (!isSeasonComplete(year) && tl.length) {
        const today = TODAY();
        if (today > tl.at(-1).date) {
          tl = [...tl, { date: today, standings: { ...tl.at(-1).standings } }];
        }
      }
      setTl(tl);
      setCursor(getTodayCursorIdx(tl));
      setPoRuns(po);
      setMadeP(po.length > 0);
      setSeaByDate(sched.byDate);
      setNextGame(sched.next);
    }).catch(e => setError("Unable to load season data — " + e.message))
      .finally(() => setLoading(false));
  }, [year]);

  const today      = TODAY();
  const cursorDate = timeline[cursor]?.date ?? today;
  const cursorGame = seaByDate[cursorDate] ?? null;
  const isLiveNow  = cursorDate === today && cursorGame?.state === "Live";

  useEffect(() => {
    clearInterval(liveRef.current);
    setLinescore(null);
    if (!isLiveNow || !cursorGame?.pk) return;
    const poll = () => getLinescore(cursorGame.pk).then(setLinescore).catch(() => {});
    poll();
    liveRef.current = setInterval(poll, 20000);
    return () => clearInterval(liveRef.current);
  }, [isLiveNow, cursorGame?.pk]);

  const pt    = timeline[cursor];
  const sea   = pt?.standings[SEA_ID];
  const atEnd = cursor >= timeline.length - 1;

  const recent = useMemo(() =>
    timeline.slice(Math.max(0, cursor - 10), cursor).map(p => p.standings[SEA_ID]?.last).filter(Boolean),
    [timeline, cursor]);

  const inProgress = year != null && !isSeasonComplete(year);

  // October register: postseason dates read series state instead of a frozen
  // September record. The final date keeps the season verdict, so the
  // end-of-season calibration is unchanged — October is how it felt while it
  // was happening; the last game is what the season came to.
  const october = useMemo(() =>
    pt?.isPlayoff && !atEnd ? octoberState(playoffRuns, cursorDate) : null,
    [pt, atEnd, playoffRuns, cursorDate]);

  const mood = useMemo(() =>
    october
      ? calcOctoberMood(october)
      : calcMood(sea, cursor, timeline.length, recent, atEnd ? playoffRuns : [], inProgress),
    [october, sea, cursor, timeline.length, recent, atEnd, playoffRuns, inProgress]);

  const zone = MOODS.find(z => mood <= z.t) ?? MOODS.at(-1);

  const reality = useMemo(() => {
    if (!sea || !pt) return null;
    // Is Seattle the only AL West team outscoring its opponents? (caption flavor)
    const posDiffs = teams.reduce((n, t) => {
      const s = pt.standings[t.id];
      return n + (s && (s.rs ?? 0) - (s.ra ?? 0) > 0 ? 1 : 0);
    }, 0);
    const seaDiff = (sea.rs ?? 0) - (sea.ra ?? 0);
    return buildReality(sea, cursor, timeline.length, recent,
                        atEnd ? playoffRuns : [], seaDiff > 0 && posDiffs === 1, inProgress);
  }, [sea, pt, teams, cursor, timeline.length, recent, atEnd, playoffRuns, inProgress]);

  const sorted = useMemo(() =>
    !pt ? [] :
    teams.map(t => ({ ...t, ...(pt.standings[t.id] ?? { w: 0, l: 0, gb: 0, pct: 0 }) }))
      .sort((a, b) => a.gb - b.gb || b.w - a.w),
    [pt, teams]);

  const seaRank = sorted.findIndex(t => t.id === SEA_ID) + 1;

  if (year === null) return <div className="root"><style>{CSS}</style></div>;

  return (
    <div className="root">
      <style>{CSS}</style>
      <header className="hdr">
        <div className="wrap">
          <div>
            <div className="title">Mariners Meter</div>
            <div className="sub">American League West · What it feels like to root for Seattle</div>
          </div>
          <div className="hdr-right">
            <ThemeToggle theme={theme} onToggle={toggleTheme} />
            <div className="yr-wrap">
              <label className="yr-lbl" htmlFor="season">Season</label>
              <select id="season" className="yr-sel" value={year} onChange={e => setYear(+e.target.value)}>
                {yearOpts.map(y => <option key={y} value={y}>{y}</option>)}
              </select>
              <span className="yr-range">{yearOpts.length} seasons · {yearOpts.at(-1)}–{yearOpts[0]}</span>
            </div>
          </div>
        </div>
      </header>

      <div className="body">
        <GameCard game={cursorGame} nextGame={nextGame} cursorDate={cursorDate} linescore={linescore} />

        {LORE[year] && <div className="lore">"{LORE[year]}"</div>}
        {sea && <MoodMeter mood={mood} zone={zone} reality={reality} october={october}
          onExplain={() => setShowAbout(true)} />}

        {/* Playoff panel — between feelings meter and the standings chart */}
        {playoffRuns.length > 0 &&
          <PlayoffPanel runs={playoffRuns} year={year} madePlayoffs={madePlayoffs} cursorDate={cursorDate}
            onJump={date => {
              const i = timeline.findIndex(e => e.date === date);
              if (i >= 0) setCursor(i);
            }} />}

        <div className="sh">
          <span className="st">AL West Standings Race · {year}</span>
          <span className="shint">drag cursor to travel through the season</span>
        </div>
        <div className="legend">
          {teams.map(t => (
            <div key={t.id} className="leg" style={{ color: t.sea ? "var(--accent-ink)" : "var(--ink-dim)" }}>
              <div className="ll" style={{ background: t.color, opacity: t.sea ? 1 : 0.55 }} />
              {t.abbr}
            </div>
          ))}
        </div>

        <div className="chart-wrap">
          {loading && (
            <div className="loader">
              <div className="ldots"><div className="ld"/><div className="ld"/><div className="ld"/></div>
              <div className="loader-lbl">Loading season data</div>
            </div>
          )}
          {!loading && error && <div className="err" style={{ color: "var(--mark)" }}>{error}</div>}
          {!loading && !error && timeline.length === 0 && (
            <div className="err" style={{ color: "var(--ink-dim)", display:"flex", alignItems:"center", justifyContent:"center", minHeight:"100px" }}>
              {year >= nowYear ? "There's always next year." : preMsg}
            </div>
          )}
          {!loading && !error && timeline.length > 0 && (
            <Chart timeline={timeline} teams={teams} cursor={cursor} onCursor={setCursor} />
          )}
        </div>

        {pt && (
          <div className="info-row">
            <Standings sorted={sorted} date={pt.date} />
            <SeaBox sea={sea} rank={seaRank} recent={recent} reality={reality} />
          </div>
        )}
      </div>

      {/* JP badge — fixed top-right */}
      <a className="jp-badge" href="https://jeremyperonto.com" title="jeremyperonto.com">JP</a>

      <footer>
        <div className="wrap">
        <a href="https://jeremyperonto.com">jeremyperonto.com</a>
        &nbsp;·&nbsp;
        <a href="https://github.com/jeremyperonto/MarinersMeter">Build one for your team</a>
        &nbsp;·&nbsp;
        <button className="foot-btn" onClick={() => setShowAbout(true)}>About &amp; suggest an improvement</button>
        &nbsp;·&nbsp;
        Data from <a href="https://www.retrosheet.org" target="_blank" rel="noopener">Retrosheet</a>
        &nbsp;and&nbsp;
        <a href="https://www.mlb.com" target="_blank" rel="noopener">MLB</a>
        </div>
      </footer>

      {showAbout && <AboutModal onClose={() => setShowAbout(false)} />}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
